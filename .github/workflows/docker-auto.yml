name: '智能追踪上游并自动构建推送 Docker'

on:
  schedule:
    # 每天北京时间凌晨 2:00（UTC 18:00）自动检查一次更新
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: '是否强制构建（忽略更新检查直接编译）'
        type: boolean
        default: false

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'zashboard'
            repo: 'https://github.com/Zephyruso/zashboard.git'
            branch: 'main'
          - name: 'yyb-go-enhanced'
            repo: 'https://github.com/525815266/YYB-Go-Enhanced.git'
            branch: 'main'
          - name: 'wb2api-panel'
            repo: 'https://github.com/linguo2625469/workbuddy2api-panel.git'
            branch: 'main'

    steps:
      - name: Checkout self
        uses: actions/checkout@v4

      - name: 检查上游更新
        id: check_update
        run: |
          # 获取上游仓库指定分支的最新 commit hash
          UPSTREAM_SHA=$(git ls-remote "${{ matrix.repo }}" "refs/heads/${{ matrix.branch }}" | awk '{print $1}')

          # 如果获取不到分支，尝试获取 HEAD
          if [ -z "$UPSTREAM_SHA" ]; then
            UPSTREAM_SHA=$(git ls-remote "${{ matrix.repo }}" HEAD | awk '{print $1}')
          fi

          echo "上游最新 Commit: $UPSTREAM_SHA"
          echo "upstream_sha=$UPSTREAM_SHA" >> $GITHUB_OUTPUT
          echo "upstream_sha_short=${UPSTREAM_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: 读取上次构建记录
        id: cache_check
        uses: actions/cache@v4
        with:
          path: .last_build_sha_${{ matrix.name }}
          key: build-cache-${{ matrix.name }}-${{ steps.check_update.outputs.upstream_sha }}

      - name: 判断是否需要构建
        id: decision
        run: |
          FORCE="${{ github.event.inputs.force_build }}"
          CACHE_HIT="${{ steps.cache_check.outputs.cache-hit }}"

          if [ "$FORCE" = "true" ] || [ "$CACHE_HIT" != "true" ]; then
            echo "need_build=true" >> $GITHUB_OUTPUT
            echo "检测到代码更新或手动强制构建，开始执行编译..."
          else
            echo "need_build=false" >> $GITHUB_OUTPUT
            echo "上游无新提交，跳过构建。"
          fi

      - name: 克隆上游源码
        if: steps.decision.outputs.need_build == 'true'
        run: |
          git clone --depth 1 "${{ matrix.repo }}" ./source_code
          # 浅克隆默认不拉 tag，补一次（失败不影响后续）
          cd ./source_code && git fetch --tags --depth=1 origin 2>/dev/null || true

      - name: 探测源码版本号
        id: version
        if: steps.decision.outputs.need_build == 'true'
        working-directory: ./source_code
        run: |
          set -euo pipefail

          detect_version() {
            local f v

            # 1) 根目录版本文件（YYB-Go-Enhanced 用这个：VERSION 内容为 0.2.25）
            for f in VERSION VERSION.txt version.txt version .version; do
              if [[ -f "$f" ]]; then
                v="$(tr -d '[:space:]' < "$f")"
                if [[ -n "$v" ]]; then printf '%s' "$v"; return 0; fi
              fi
            done

            # 2) Node 项目 package.json（zashboard 用这个：3.29.1）
            if [[ -f package.json ]]; then
              v="$(sed -nE 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p' package.json | head -n1)"
              if [[ -n "$v" ]]; then printf '%s' "$v"; return 0; fi
            fi

            # 3) Python 项目 pyproject.toml
            if [[ -f pyproject.toml ]]; then
              v="$(sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' pyproject.toml | head -n1)"
              if [[ -n "$v" ]]; then printf '%s' "$v"; return 0; fi
            fi

            # 4) Rust 项目 Cargo.toml
            if [[ -f Cargo.toml ]]; then
              v="$(sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -n1)"
              if [[ -n "$v" ]]; then printf '%s' "$v"; return 0; fi
            fi

            # 5) Go 项目：appVersion 常量最精确（wb2api-panel 用这个：1.11.11-panel）
            v="$(grep -rhoE 'appVersion[[:space:]]*=[[:space:]]*"[^"]+"' --include='*.go' --exclude='*_test.go' --exclude-dir=vendor . 2>/dev/null | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')"
            if [[ -n "$v" ]]; then printf '%s' "$v"; return 0; fi

            # 5b) Go 项目：独立的 Version 常量
            #     前缀 [^A-Za-z0-9_] 是词边界，用来排除 ClientVersion / CliVersion 这类误匹配
            v="$(grep -rhoE '(^|[^A-Za-z0-9_])[Vv]ersion[[:space:]]*=[[:space:]]*"[^"]+"' --include='*.go' --exclude='*_test.go' --exclude-dir=vendor . 2>/dev/null | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')"
            if [[ -n "$v" ]]; then printf '%s' "$v"; return 0; fi

            # 6) C/C++ 项目的 version.h
            for f in version.h VERSION.h; do
              if [[ -f "$f" ]]; then
                v="$(grep -m1 -oE '[Vv]ersion[[:space:]]+"[^"]+"' "$f" | sed -E 's/.*"([^"]+)".*/\1/')"
                if [[ -n "$v" ]]; then printf '%s' "$v"; return 0; fi
              fi
            done

            # 7) 最近的 git tag（如 v0.2.25）
            v="$(git describe --tags --abbrev=0 2>/dev/null || true)"
            if [[ -n "$v" ]]; then printf '%s' "$v"; return 0; fi

            return 1
          }

          SOURCE_VERSION="$(detect_version || true)"
          SOURCE_VERSION="${SOURCE_VERSION#v}"
          SOURCE_VERSION="${SOURCE_VERSION#V}"

          if [[ -n "$SOURCE_VERSION" ]]; then
            echo "version_tag=v${SOURCE_VERSION}" >> "$GITHUB_OUTPUT"
            echo "已探测到版本号 -> v${SOURCE_VERSION}"
          else
            SHORT_SHA="${{ steps.check_update.outputs.upstream_sha_short }}"
            echo "version_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "未探测到版本号，回退为短 SHA -> sha-${SHORT_SHA}"
          fi

      - name: 配置 QEMU 跨架构支持
        if: steps.decision.outputs.need_build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: 配置 Docker Buildx
        if: steps.decision.outputs.need_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        if: steps.decision.outputs.need_build == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: 构建并推送镜像
        if: steps.decision.outputs.need_build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./source_code
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ matrix.name }}:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ matrix.name }}:${{ steps.version.outputs.version_tag }}
          push: true

      - name: 更新构建缓存标记
        if: steps.decision.outputs.need_build == 'true'
        run: |
          echo "${{ steps.check_update.outputs.upstream_sha }}" > .last_build_sha_${{ matrix.name }}
